function fetchEEXPrice() {
  var now = new Date();
  var start = now.toISOString().slice(0,10) + 'T00:00Z';
  var end = now.toISOString().slice(0,10) + 'T23:59Z';
  var url = 'https://api.energy-charts.info/price?bzn=DE-LU&start=' + start + '&end=' + end;
  fetch(url, {signal: AbortSignal.timeout(8000)})
    .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function(data) {
      if (!data.price || data.price.length === 0) return;
      // Get the most recent non-null price
      var prices = data.price.filter(function(p) { return p !== null; });
      if (prices.length === 0) return;
      var latest = prices[prices.length - 1];
      var avg = prices.reduce(function(a, b) { return a + b; }, 0) / prices.length;
      var displayPrice = Math.round(latest);
      var fri27 = 74; // Friday Feb 27 baseline
      var pctChg = ((displayPrice - fri27) / fri27 * 100).toFixed(1);
      var sign = pctChg >= 0 ? '+' : '';
      // Update the KPI object
      KPI.forEach(function(k) {
        if (k.l === 'EU Power (DE)') {
          k.v = '€' + displayPrice;
          k.c = sign + pctChg + '%';
          k.d = pctChg >= 0 ? 'up' : 'dn';
          k.r = 'Fri 27: €74/MWh';
        }
      });
      renderKPIs();
    })
    .catch(function() { /* Keep static value */ });
}

var liveNewsLoaded = false;

function classifyArticle(title) {
  var tl = title.toLowerCase();
  if (tl.match(/strike|attack|war|bomb|missile|drone|military|conflict|nuclear|weapon|sanction|blockade|block|halt|shut|close/)) return 'cr';
  if (tl.match(/surge|spike|jump|soar|rally|high|record|risk|warn|threat|crisis|disrupt|suspend/)) return 'hi';
  return 'ne';
}

function formatNewsTime(isoDate) {
  if (!isoDate) return '';
  var d = new Date(isoDate);
  var now = new Date();
  var diff = Math.floor((now - d) / 60000); // minutes
  if (diff < 60) return diff + 'm ago';
  if (diff < 1440) return Math.floor(diff/60) + 'h ago';
  return d.toLocaleDateString('en-GB', {month:'short', day:'numeric'});
}

function renderNewsItems(items) {
  return items.map(function(n) {
    var headline = n.url ? '<a href="'+n.url+'" target="_blank" rel="noopener" style="color:var(--tx);text-decoration:none">'+n.h+' <span style="color:var(--g);font-size:.7rem">↗</span></a>' : n.h;
    return '<div class="ni '+n.sv+'" style="cursor:'+(n.url?'pointer':'default')+'"'+(n.url?' onclick="window.open(\''+n.url.replace(/'/g,"\\'")+'\',\'_blank\')"':'')+'>'+
      '<div style="display:flex;justify-content:space-between;align-items:center"><span class="nt">'+n.t+'</span><span class="ns '+n.sv+'">'+(n.sv==='cr'?'CRITICAL':n.sv==='hi'?'HIGH':'INFO')+'</span></div>'+
      '<div class="ntl">'+headline+'</div>'+
      '<div class="nsr">'+n.s+'</div></div>';
  }).join('');
}

function newsHTML(id) {
  return '<div class="cd"><div class="cd-h"><div class="cdot"></div>Live Conflict & Energy News <span id="'+id+'-status" style="font-size:.6rem;color:var(--txl);font-weight:400;margin-left:8px">loading live feed...</span></div><div class="cd-b" style="padding:4px"><div class="nscr" id="'+id+'">'+renderNewsItems(STATIC_NEWS)+'</div></div></div>';
}

// Fetch live news from Vercel API (returns clean JSON)
function fetchLiveNews(){
  var ts=Date.now();
  fetch('/api/news?_t='+ts).then(function(r){return r.json()}).then(function(data){
    if(data.success && data.articles && data.articles.length>0){
      var items=data.articles.map(function(a){
        return {t:formatNewsTime(a.pubDate),h:a.title,s:a.source||'News',sv:classifyArticle(a.title),url:a.link||''};
      });
      ['nf1','nf2','nf3','nf-main'].forEach(function(id){var el=document.getElementById(id);if(el)el.innerHTML=renderNewsItems(items)});
      var srcCount=data.sources?Object.keys(data.sources).length:0;
      updateNewsStatus('live · '+data.count+' articles from '+srcCount+' sources · refresh 5min');
      liveNewsLoaded=true;
    } else { fallbackCORSNews() }
  }).catch(function(){ fallbackCORSNews() });
}

// Fallback: try CORS proxies for Google News RSS
function fallbackCORSNews(){
  var q='Strait+Hormuz+oil+Iran+war';
  var rssUrl='https://news.google.com/rss/search?q='+q+'&hl=en&gl=US&ceid=US:en&num=20&_t='+Date.now();
  var proxies=['https://corsproxy.io/?'+encodeURIComponent(rssUrl),'https://api.allorigins.win/raw?url='+encodeURIComponent(rssUrl)];
  function tryProxy(i){
    if(i>=proxies.length){updateNewsStatus('static fallback (live unavailable)');return}
    fetch(proxies[i],{signal:AbortSignal.timeout(6000)}).then(function(r){return r.text()}).then(function(xml){
      var arts=[];var re=/<item>([\s\S]*?)<\/item>/g,m;
      while((m=re.exec(xml))!==null&&arts.length<30){
        var ti=exTag(m[1],'title'),li=exTag(m[1],'link'),pd=exTag(m[1],'pubDate'),sr=exTag(m[1],'source');
        if(ti&&li)arts.push({t:formatNewsTime(pd),h:ti,s:sr||'Google News',sv:classifyArticle(ti),url:li});
      }
      if(arts.length>0){
        ['nf1','nf2','nf3','nf-main'].forEach(function(id){var el=document.getElementById(id);if(el)el.innerHTML=renderNewsItems(arts)});
        updateNewsStatus('live (proxy) · '+arts.length+' articles');
        liveNewsLoaded=true;
      } else { tryProxy(i+1) }
    }).catch(function(){ tryProxy(i+1) });
  }
  tryProxy(0);
}
function exTag(xml,tag){var m=new RegExp('<'+tag+'[^>]*><!\\[CDATA\\[([\\s\\S]*?)\\]\\]></'+tag+'>').exec(xml);if(m)return m[1].trim().replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"');m=new RegExp('<'+tag+'[^>]*>([\\s\\S]*?)</'+tag+'>').exec(xml);return m?m[1].trim().replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"'):''}
function updateNewsStatus(msg){var now=new Date(),ts=now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0');['nf1-status','nf2-status','nf3-status','nf-main-status'].forEach(function(id){var el=document.getElementById(id);if(el){el.textContent=msg+(msg.indexOf('live')>=0?' · '+ts:'');el.style.color=msg.indexOf('live')>=0?'var(--g)':'var(--txl)'}})}

  var data=[
    // 2018

    ["2022-01",86.5,-1.0],["2022-03",117.3,-2.5],["2022-06",113.9,-1.8],["2022-09",89.8,-0.3],["2022-12",80.9,0.5],

    ["2023-03",79.3,0.8],["2023-06",75.7,0.5],["2023-09",93.3,-1.2],["2023-12",77.6,0.3],
    // 2024

    // 2025
    ["2025-03",71.2,1.2],["2025-06",64.8,1.5],["2025-09",62.5,1.0],["2025-12",68.3,0.3],
    // 2026
    ["2026-01",69.5,0.1],["2026-02",72.0,-0.2],["2026-03",100.0,-18.0],["2026-04",117.0,-22.0],["2026-05",102.0,-15.0],["2026-06",85.0,-10.0],["2026-07",83.0,-12.0],["2026-08",80.0,-9.0],
  ];
  var W=el.clientWidth||900,H=320,mg={t:25,r:60,b:40,l:60};

  });
  // Price line
  var line=d3.line().x(function(d){return xScale(d[0])+xScale.bandwidth()/2}).y(function(d){return yPrice(d[1])}).curve(d3.curveMonotoneX);
  g.append('path').datum(data).attr('d',line).attr('fill','none').attr('stroke','var(--acc)').attr('stroke-width',2.5);

  g.append('text').attr('x',w+10).attr('y',-8).attr('fill','var(--txl)').attr('font-size','10px').text('Surplus/Deficit');
  // Zero line
  g.append('line').attr('x1',0).attr('x2',w).attr('y1',zero).attr('y2',zero).attr('stroke','var(--txl)').attr('stroke-width',1).attr('stroke-dasharray','3,3');
}

// "1Y" (12M). An invalid range is not rejected loudly: the widget silently falls

function buildAllCharts(interval,range){
  tfTimers.forEach(clearTimeout);tfTimers=[];
  var gen=++tfGen;
  ALL_CHARTS.forEach(function(c,i){
    tfTimers.push(setTimeout(function(){
      if(gen!==tfGen)return; // a newer click superseded this rebuild
      var el=document.getElementById('tv-all-'+i);if(!el)return;
      var opts=JSON.stringify({symbol:c.sym,interval:interval,timezone:"Europe/Berlin",theme:"dark",style:"3",locale:"en",backgroundColor:"rgba(14,25,24,1)",gridColor:"rgba(26,46,44,0.15)",hide_top_toolbar:true,hide_legend:false,save_image:false,hide_volume:true,allow_symbol_change:false,range:range,calendar:false,autosize:true});
      var url="https://s.tradingview.com/embed-widget/advanced-chart/?locale=en#"+encodeURIComponent(opts);
      // build detached, then mount — never reassign .src on a live iframe (it pushes history entries)
      var f=document.createElement('iframe');
      f.src=url;f.loading='lazy';f.setAttribute('sandbox','allow-scripts allow-same-origin allow-popups');
      f.style.cssText='width:100%;height:100%;border:none;display:block;background:#0E1918';
      el.innerHTML='';el.appendChild(f);
    },i*120));
  });
}
function setTF(k){

}
